name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & offline tests (.NET ${{ matrix.dotnet }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.0 is the supported minimum; track the current LTS.
        dotnet: ['8.0.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore
        run: dotnet restore mongreldb-fsharp.sln

      # Builds both projects with warnings-as-errors (TreatWarningsAsErrors=true).
      - name: Build
        run: dotnet build mongreldb-fsharp.sln --configuration Release --no-restore

      # The offline unit tests (exception hierarchy, query-builder alias
      # translation, cells flattening, JSON decoding) run without a daemon.
      # Live tests self-skip when no server binary is found.
      - name: Run tests
        run: dotnet test mongreldb-fsharp.sln --configuration Release --no-build --logger "console;verbosity=normal"

  live:
    # Boots a real mongreldb-server and runs the live round-trip suite.
    name: Live integration (against mongreldb-server)
    runs-on: ubuntu-latest
    env:
      SERVER_VERSION: '0.63.1'
      # The test harness boots the daemon itself from ./bin/mongreldb-server.
      # MONGRELDB_SERVER points it at the downloaded binary.
      MONGRELDB_SERVER: ./bin/mongreldb-server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & build
        run: |
          dotnet restore mongreldb-fsharp.sln
          dotnet build mongreldb-fsharp.sln --configuration Release

      - name: Cache mongreldb-server binary
        id: server-cache
        uses: actions/cache@v6
        with:
          path: bin/mongreldb-server
          key: mongreldb-server-linux-x64-${{ env.SERVER_VERSION }}

      - name: Download mongreldb-server
        if: steps.server-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          curl -fsSL -o bin/mongreldb-server \
            "https://github.com/visorcraft/MongrelDB/releases/download/v${SERVER_VERSION}/mongreldb-server-linux-x64"
          chmod +x bin/mongreldb-server
          ./bin/mongreldb-server --help | head -n 1

      - name: Run live tests
        run: dotnet test mongreldb-fsharp.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Start mongreldb-server for examples
        run: |
          rm -rf /tmp/mongreldb-data-ex
          ./bin/mongreldb-server /tmp/mongreldb-data-ex --port 8453 > /tmp/mongreldb-server-ex.log 2>&1 &
          echo $! > /tmp/mongreldb-server-ex.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8453/health >/dev/null 2>&1; then
              echo "mongreldb-server is healthy for examples"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8453/health >/dev/null || (cat /tmp/mongreldb-server-ex.log && exit 1)

      - name: Run examples
        # The examples are .fsx scripts that reference the built library
        # assembly under src/Visorcraft.MongrelDB/bin/Debug/net8.0. Build that
        # configuration so the #r reference resolves, then run each script.
        run: |
          dotnet build src/Visorcraft.MongrelDB/Visorcraft.MongrelDB.fsproj --configuration Debug
          for ex in examples/*.fsx; do
            echo "=== Running $ex ==="
            dotnet fsi "$ex" || { echo "FAILED: $ex"; cat /tmp/mongreldb-server-ex.log; exit 1; }
          done

      - name: Stop mongreldb-server for examples
        if: always()
        run: |
          if [ -f /tmp/mongreldb-server-ex.pid ]; then
            kill "$(cat /tmp/mongreldb-server-ex.pid)" 2>/dev/null || true
          fi

      - name: Dump server log on failure
        if: failure()
        run: |
          # The harness writes its server log to a temp file; print the most
          # recent one if present.
          log="$(ls -t /tmp/mongreldb-fsharp-server-*.log 2>/dev/null | head -n 1)"
          if [ -n "$log" ]; then cat "$log"; fi
          if [ -f /tmp/mongreldb-server-ex.log ]; then cat /tmp/mongreldb-server-ex.log; fi
